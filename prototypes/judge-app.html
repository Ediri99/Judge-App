<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stall Judging — Judge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2532; --ink-soft:#54606F; --ink-faint:#8A95A1;
    --paper:#F4F0E8; --surface:#FFFFFF;
    --line:rgba(28,37,50,.10); --line-strong:rgba(28,37,50,.16);
    --gold:#B07D24; --gold-deep:#7E5810; --gold-soft:#F3E7CC; --gold-line:#E4CE9E;
    --green:#2F7D5B; --green-soft:#E4F0E9;
    --red:#C0492F; --red-soft:#F8E7E3;
    --display:'Fraunces',Georgia,serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--body); color:var(--ink); background:var(--paper);
    -webkit-font-smoothing:antialiased; line-height:1.5;
    display:flex; align-items:center; justify-content:center; padding:24px 16px;
    background-image:radial-gradient(rgba(28,37,50,.035) 1px,transparent 1px);
    background-size:22px 22px;
  }

  /* ---- phone frame ---- */
  .phone{
    width:100%; max-width:392px; height:792px; max-height:calc(100dvh - 48px);
    background:var(--surface); border-radius:30px; overflow:hidden;
    border:1px solid var(--line-strong);
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 18px 50px -20px rgba(28,37,50,.35);
    display:flex; flex-direction:column; position:relative;
  }
  .view{display:none; flex-direction:column; flex:1; min-height:0}
  .view.active{display:flex}

  /* ---- shared header ---- */
  .topbar{
    padding:18px 20px 14px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; flex-shrink:0;
  }
  .topbar .back{
    width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
    background:none;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink-soft);font-size:17px;transition:background .15s;
  }
  .topbar .back:hover{background:var(--paper)}
  .topbar h1{font-family:var(--display);font-weight:500;font-size:18px;line-height:1.15}
  .topbar .sub{font-size:12px;color:var(--ink-faint);margin-top:1px}

  /* ---- sign in ---- */
  #signin{justify-content:center;padding:24px 30px;overflow-y:auto}
  .crest{text-align:center;margin-bottom:30px}
  .rosette{
    width:64px;height:64px;border-radius:50%;margin:0 auto 16px;
    background:var(--gold-soft);border:1px solid var(--gold-line);
    display:flex;align-items:center;justify-content:center;color:var(--gold-deep);font-size:28px;
  }
  .crest h1{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:-.01em}
  .crest p{color:var(--ink-soft);font-size:13.5px;margin-top:6px}
  label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-soft);margin:0 0 6px 2px}
  .field{margin-bottom:16px}
  input[type=text],input[type=password]{
    width:100%;height:48px;border-radius:13px;border:1px solid var(--line-strong);
    background:var(--surface);padding:0 15px;font-family:var(--body);font-size:15px;color:var(--ink);
    transition:border-color .15s, box-shadow .15s;
  }
  input::placeholder{color:var(--ink-faint)}
  input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,125,36,.16)}
  .btn{
    width:100%;height:50px;border:none;border-radius:13px;cursor:pointer;
    font-family:var(--body);font-size:15px;font-weight:600;letter-spacing:.01em;
    background:var(--ink);color:#F6F3EC;transition:transform .08s, background .15s;
  }
  .btn:hover{background:#0f1722}
  .btn:active{transform:scale(.985)}
  .btn-gold{background:var(--gold)} .btn-gold:hover{background:var(--gold-deep)}
  .hint{text-align:center;font-size:11.5px;color:var(--ink-faint);margin-top:18px}

  /* ---- list ---- */
  .list-head{padding:16px 20px 12px;flex-shrink:0;border-bottom:1px solid var(--line)}
  .greet{display:flex;justify-content:space-between;align-items:flex-end}
  .greet h1{font-family:var(--display);font-weight:500;font-size:21px}
  .namerow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .appbadge{font-size:11px;font-weight:600;letter-spacing:.04em;padding:3px 10px;border-radius:99px;text-transform:uppercase}
  .appbadge.stalls{background:#DCEFEA;color:#1E7F6B;border:1px solid #BFE2D8}
  .appbadge.uni{background:#ECE3F6;color:#6D4AA6;border:1px solid #DBC9EF}
  .greet .event{font-size:12px;color:var(--ink-faint);margin-top:2px}
  .progress{
    text-align:right;flex-shrink:0
  }
  .progress .count{font-family:var(--display);font-size:21px;font-weight:500;line-height:1}
  .progress .count b{color:var(--gold-deep);font-weight:500}
  .progress .lbl{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
  .bar{height:5px;border-radius:99px;background:var(--paper);margin-top:12px;overflow:hidden}
  .bar i{display:block;height:100%;width:60%;background:var(--gold);border-radius:99px}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{
    flex:1;height:36px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);
    font-family:var(--body);font-size:12.5px;color:var(--ink-soft);cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;padding:0 12px;transition:border-color .15s;
  }
  .chip:hover{border-color:var(--ink-faint)}
  .chip.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-deep)}
  .chip .car{font-size:15px;opacity:.6}
  .filters select{
    flex:1 1 46%;min-width:0;height:40px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);
    font-family:var(--body);font-size:13px;color:var(--ink-soft);padding:0 32px 0 13px;cursor:pointer;appearance:none;
    text-overflow:ellipsis;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6' fill='none' stroke='%238A95A1' stroke-width='1.4'><path d='M1 1l4 4 4-4'/></svg>");
    background-repeat:no-repeat;background-position:right 11px center;transition:border-color .15s,box-shadow .15s;
  }
  .filters select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,125,36,.16)}
  .filters select.on{border-color:var(--gold);background-color:var(--gold-soft);color:var(--gold-deep)}

  .scroll{flex:1;overflow-y:auto;padding:8px 12px 16px}
  .stall{
    display:flex;align-items:center;gap:13px;padding:12px;border-radius:15px;cursor:pointer;margin-bottom:6px;
    border:1px solid transparent;transition:background .15s, border-color .15s;
  }
  .stall.done{background:var(--green-soft);border-color:#CBE3D5}
  .stall.todo{background:var(--red-soft);border-color:#EFD2CB}
  .stall:hover{border-color:var(--ink-faint)}
  .thumb{
    width:50px;height:50px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(135deg,#ECE6DA,#DED5C4);
    display:flex;align-items:center;justify-content:center;color:#B3A88F;font-size:20px;
  }
  .stall .meta{flex:1;min-width:0}
  .stall .name{font-weight:600;font-size:15px}
  .stall .tags{font-size:12px;color:var(--ink-faint);margin-top:2px}
  .state{flex-shrink:0;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500}
  .state .dot{width:7px;height:7px;border-radius:50%}
  .state.done{color:var(--green)} .state.done .dot{background:var(--green)}
  .state.todo{color:var(--red)} .state.todo .dot{background:var(--red)}
  .state .score{font-family:var(--display);font-size:15px;color:var(--ink)}

  /* ---- scoring ---- */
  #score .scroll{padding:0 20px 120px}
  .hero{
    height:150px;border-radius:16px;margin:14px 0 8px;
    background:linear-gradient(135deg,#ECE6DA,#DED5C4);
    display:flex;align-items:center;justify-content:center;color:#B3A88F;font-size:34px;position:relative;
  }
  .hero .cat{
    position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.92);
    border-radius:8px;padding:5px 11px;font-size:11.5px;font-weight:500;color:var(--ink-soft);
  }
  .crit{padding:16px 0;border-bottom:1px solid var(--line)}
  .crit:last-of-type{border-bottom:none}
  .crit-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
  .crit-top .q{font-size:14.5px;font-weight:500}
  .crit-top .v{font-family:var(--display);font-size:22px;font-weight:500;line-height:1}
  .crit-top .v small{font-size:13px;color:var(--ink-faint);font-family:var(--body)}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;
    background:var(--paper);cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--gold);
    border:3px solid #fff;box-shadow:0 1px 4px rgba(28,37,50,.3);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:24px;height:24px;border-radius:50%;background:var(--gold);
    border:3px solid #fff;box-shadow:0 1px 4px rgba(28,37,50,.3);cursor:pointer;border:none;
  }
  .scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-faint);margin-top:8px}
  .comment{margin-top:18px}
  .comment textarea{
    width:100%;min-height:64px;border-radius:13px;border:1px solid var(--line-strong);
    padding:11px 14px;font-family:var(--body);font-size:14px;color:var(--ink);resize:vertical;
  }
  .comment textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,125,36,.16)}

  .photos{margin-top:18px}
  .photos .cap{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px 2px}
  .photos .cap span{font-size:11px;color:var(--ink-faint)}
  .photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .photo-slot{
    position:relative;aspect-ratio:4/3;border-radius:13px;overflow:hidden;
    border:1px dashed var(--line-strong);background:var(--paper);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    color:var(--ink-soft);cursor:pointer;font-size:12.5px;transition:background .15s,border-color .15s;
  }
  .photo-slot:hover{background:#EEE9DF;border-color:var(--gold)}
  .photo-slot .ic{font-size:22px;color:var(--gold)}
  .photo-slot.filled{border-style:solid;border-color:var(--line);cursor:default}
  .photo-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .photo-slot .rm{
    position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;border:none;
    background:rgba(28,37,50,.78);color:#fff;font-size:15px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .15s;
  }
  .photo-slot .rm:hover{background:var(--ink)}

  .footer{
    position:absolute;left:0;right:0;bottom:0;padding:14px 20px 18px;
    background:linear-gradient(to top,var(--surface) 72%,rgba(255,255,255,0));
    display:flex;align-items:center;gap:14px;
  }
  .total{flex-shrink:0}
  .total .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint)}
  .total .num{font-family:var(--display);font-size:24px;font-weight:600;line-height:1}
  .total .num small{font-size:14px;color:var(--ink-faint);font-weight:400}
  .footer .btn{flex:1}

  /* ---- toast ---- */
  .toast{
    position:absolute;left:16px;right:16px;bottom:22px;background:var(--ink);color:#F6F3EC;
    border-radius:13px;padding:13px 16px;font-size:13.5px;display:flex;align-items:center;gap:9px;
    transform:translateY(140%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:5;
  }
  .toast.show{transform:translateY(0)}
  .toast i{color:#E9C977}

  @media (max-width:440px){
    body{padding:0;align-items:stretch}
    .phone{max-width:none;height:100dvh;max-height:none;border-radius:0;border:none;box-shadow:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="phone">

  <!-- ================= SIGN IN ================= -->
  <section class="view active" id="signin">
    <div class="crest">
      <div class="rosette">✦</div>
      <h1>Stall judging</h1>
      <p>Annual food &amp; craft expo · 2026</p>
    </div>
    <div class="field">
      <label for="jcode">Judge name or code</label>
      <input type="text" id="jcode" placeholder="e.g. JUDGE-07" value="JUDGE-07">
    </div>
    <div class="field">
      <label for="jpin">PIN</label>
      <input type="password" id="jpin" placeholder="• • • •" value="1234">
    </div>
    <button class="btn btn-gold" onclick="go('list')">Sign in</button>
    <p class="hint">Use the code and PIN printed on your judge card.</p>
  </section>

  <!-- ================= STALL LIST ================= -->
  <section class="view" id="list">
    <div class="list-head">
      <div class="greet">
        <div>
          <div class="namerow"><h1>Hi, Priya</h1><span class="appbadge stalls">Stalls</span></div>
          <div class="event">Food &amp; craft expo</div>
        </div>
        <div class="progress">
          <div class="count"><b id="doneN">6</b> / 10</div>
          <div class="lbl">scored</div>
        </div>
      </div>
      <div class="bar"><i id="barFill"></i></div>
      <div class="filters">
        <select id="hallSel" onchange="setFilter('hall',this.value)" aria-label="Filter by hall"></select>
        <select id="catSel" onchange="setFilter('cat',this.value)" aria-label="Filter by category"></select>
      </div>
    </div>
    <div class="scroll" id="stallList"></div>
  </section>

  <!-- ================= SCORE ================= -->
  <section class="view" id="score">
    <div class="topbar">
      <button class="back" onclick="go('list')">←</button>
      <div>
        <h1 id="sName">Clay &amp; Co</h1>
        <div class="sub" id="sMeta">Craft · Hall A</div>
      </div>
    </div>
    <div class="scroll">
      <div class="hero">▦<span class="cat" id="sCat">Craft · Hall A</span></div>
      <div id="crits"></div>
      <div class="comment">
        <label for="cmt">Notes <span style="color:var(--ink-faint);font-weight:400">(optional)</span></label>
        <textarea id="cmt" placeholder="Add any notes…"></textarea>
      </div>
      <div class="photos">
        <div class="cap">
          <label style="margin:0">Photos <span style="color:var(--ink-faint);font-weight:400">(optional)</span></label>
          <span id="photoCount">0 / 2</span>
        </div>
        <div class="photo-grid" id="photoGrid"></div>
        <input type="file" id="photoInput" accept="image/*" capture="environment" hidden onchange="addPhoto(this)">
      </div>
    </div>
    <div class="footer">
      <div class="total">
        <div class="lbl">Total</div>
        <div class="num"><span id="totN">0</span><small> / 100</small></div>
      </div>
      <button class="btn btn-gold" onclick="submitScore()">Submit score</button>
    </div>
  </section>

  <div class="toast" id="toast"><i>✓</i><span id="toastMsg">Saved</span></div>
</div>

<script>
  const CRITERIA = ['Stall outlook','Innovative thinking','Eye-catching promotional / LED','Product information','Catalogue','Sampling','Marketing approach','Stall staff','Attire of staff','Tech-driven'];
  const stalls = [
    {id:1,name:'Aussee Oats Milling (Pvt) Ltd',stall:'L01, L02',hall:'Lobby',cat:'Food',done:true,total:88},
    {id:2,name:'Cargills Ceylon PLC',stall:'L9, L10',hall:'Lobby',cat:'Food',done:false,total:0},
    {id:3,name:'Rancrisp Marketing (Pvt) Ltd',stall:'A1, A2',hall:'Hall A',cat:'Food',done:true,total:81},
    {id:4,name:'Crystal Pack (Pvt) Ltd',stall:'A4',hall:'Hall A',cat:'Packaging',done:true,total:76},
    {id:5,name:'Budry Scales (Pvt) Ltd',stall:'A14, A15',hall:'Hall A',cat:'Machinery',done:false,total:0},
    {id:6,name:'Hemsons International (Pvt) Ltd',stall:'B1',hall:'Hall B',cat:'Packaging',done:true,total:90},
    {id:7,name:'Anods Cocoa (Pvt) Ltd',stall:'B15',hall:'Hall B',cat:'Food',done:false,total:0},
    {id:8,name:'Xpress Labels (Pvt) Ltd',stall:'C1',hall:'Hall C',cat:'Services',done:true,total:72},
    {id:9,name:'Smartpac Engineering',stall:'C4',hall:'Hall C',cat:'Machinery',done:true,total:85},
    {id:10,name:'Sri Lanka Thriposha Limited',stall:'D1',hall:'Hall D',cat:'Food',done:false,total:0}
  ];
  let current=null, filterHall='all', filterCat='all';

  function go(view){
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById(view).classList.add('active');
    if(view==='list') renderList();
  }

  function renderList(){
    const done = stalls.filter(s=>s.done).length;
    document.getElementById('doneN').textContent = done;
    document.getElementById('barFill').style.width = (done/stalls.length*100)+'%';
    const wrap = document.getElementById('stallList'); wrap.innerHTML='';
    stalls.filter(s=> (filterHall==='all'||s.hall===filterHall) && (filterCat==='all'||s.cat===filterCat))
    .forEach(s=>{
      const el=document.createElement('div'); el.className='stall '+(s.done?'done':'todo'); el.onclick=()=>openScore(s.id);
      el.innerHTML=`
        <div class="thumb">▦</div>
        <div class="meta"><div class="name">${s.name}</div><div class="tags">${s.stall?s.stall+" · ":""}${s.hall}</div></div>
        <div class="state ${s.done?'done':'todo'}">
          ${s.done?`<span class="score">${s.total}</span>`:'<span class="dot"></span>Pending'}
          ${s.done?'<span class="dot"></span>':''}
        </div>`;
      wrap.appendChild(el);
    });
  }

  const halls=['all',...new Set(stalls.map(s=>s.hall))];
  const cats=['all',...new Set(stalls.map(s=>s.cat))];
  function fillFilters(){
    const opt=(v,label)=>`<option value="${v}">${label}</option>`;
    document.getElementById('hallSel').innerHTML =
      opt('all','All halls') + halls.filter(x=>x!=='all').map(x=>opt(x,x)).join('');
    document.getElementById('catSel').innerHTML =
      opt('all','All categories') + cats.filter(x=>x!=='all').map(x=>opt(x,x)).join('');
  }
  function setFilter(type,val){
    if(type==='hall'){ filterHall=val; document.getElementById('hallSel').classList.toggle('on',val!=='all'); }
    else { filterCat=val; document.getElementById('catSel').classList.toggle('on',val!=='all'); }
    renderList();
  }
  fillFilters();

  function openScore(id){
    current = stalls.find(s=>s.id===id);
    document.getElementById('sName').innerHTML = current.name;
    const meta = (current.stall?current.stall+' · ':'')+current.hall;
    document.getElementById('sMeta').textContent = meta;
    document.getElementById('sCat').textContent = meta;
    const box=document.getElementById('crits'); box.innerHTML='';
    CRITERIA.forEach((c,i)=>{
      const start = current.done?Math.round((current.total/CRITERIA.length)): 5;
      const row=document.createElement('div'); row.className='crit';
      row.innerHTML=`
        <div class="crit-top"><span class="q">${c}</span>
          <span class="v"><span id="v${i}">${start}</span><small> / 10</small></span></div>
        <input type="range" min="0" max="10" step="1" value="${start}" oninput="setVal(${i},this.value)">
        <div class="scale"><span>0</span><span>5</span><span>10</span></div>`;
      box.appendChild(row);
    });
    document.getElementById('cmt').value='';
    photos=[]; renderPhotos();
    recalc();
    go('score');
  }

  function setVal(i,val){ document.getElementById('v'+i).textContent=val; recalc(); }
  function recalc(){
    let t=0; CRITERIA.forEach((c,i)=> t+=parseInt(document.getElementById('v'+i).textContent));
    document.getElementById('totN').textContent=t;
  }

  const MAX_PHOTOS=2; let photos=[];
  function renderPhotos(){
    const grid=document.getElementById('photoGrid'); grid.innerHTML='';
    photos.forEach((src,i)=>{
      const slot=document.createElement('div'); slot.className='photo-slot filled';
      slot.innerHTML=`<img src="${src}" alt="Stall photo ${i+1}">
        <button class="rm" aria-label="Remove photo" onclick="removePhoto(${i})">✕</button>`;
      grid.appendChild(slot);
    });
    if(photos.length<MAX_PHOTOS){
      const add=document.createElement('button'); add.className='photo-slot'; add.type='button';
      add.onclick=()=>document.getElementById('photoInput').click();
      add.innerHTML=`<span class="ic">＋</span>Add photo`;
      grid.appendChild(add);
    }
    document.getElementById('photoCount').textContent=`${photos.length} / ${MAX_PHOTOS}`;
  }
  function addPhoto(input){
    const file=input.files[0]; if(!file) return;
    if(photos.length>=MAX_PHOTOS){ toast('You can attach up to 2 photos'); input.value=''; return; }
    const reader=new FileReader();
    reader.onload=e=>{ photos.push(e.target.result); renderPhotos(); };
    reader.readAsDataURL(file); input.value='';
  }
  function removePhoto(i){ photos.splice(i,1); renderPhotos(); }

  function submitScore(){
    current.done=true;
    current.total=parseInt(document.getElementById('totN').textContent);
    const photoNote = photos.length? ` · ${photos.length} photo${photos.length>1?'s':''}`:'';
    toast(`${current.name} scored — ${current.total}/100${photoNote}`);
    setTimeout(()=>go('list'),600);
  }

  let toastT;
  function toast(msg){
    const t=document.getElementById('toast');
    document.getElementById('toastMsg').textContent=msg;
    t.classList.add('show'); clearTimeout(toastT);
    toastT=setTimeout(()=>t.classList.remove('show'),2400);
  }
</script>
</body>
</html>
